DEAP_configuration:
  name: VID
  data_instance: data/D2_cdm/PEDIANET_20260918
  #data_instance: # ENTER PATH TO LOCAL CDM HERE
  database_path: ~
  data_model: ConcePTION

set_db:
  cdm_metadata: transformations/common_configuration/CDM_metadata.rds
  database_loader_config: configuration/config_set_db.json
  output: data/D2_cdm/d2.duckdb
process_codelist:
  events_codelist_latest: transformations/common_configuration/RWE-BRIDGE/full_codelist.csv
  medicines_codelist_latest: transformations/common_configuration/RWE-BRIDGE/drug_proxies.csv
  vaccine_codelist_latest: ~
  dap_specific_concept_map: transformations/common_configuration/RWE-BRIDGE/dap_specific_concept_map.csv
  output_codelist_events: transformations/T2_semantic_harmonization/intermediate_data_file/dap_specific_codelist_events.rds
  output_codelist_medicines: transformations/T2_semantic_harmonization/intermediate_data_file/dap_specific_codelist_medicines.rds
  output_codelist_procedures: transformations/T2_semantic_harmonization/intermediate_data_file/dap_specific_codelist_procedures.rds
  output_map_missing_infomation: transformations/T2_semantic_harmonization/intermediate_data_file/dap_specific_concept_map_missing_infomation.rds
  output_concept_map: transformations/T2_semantic_harmonization/intermediate_data_file/dap_specific_concept_map.rds
create_simple_concepts:
  since_when_data_complete: transformations/T2_semantic_harmonization/intermediate_data_file/since_when_data_complete.rds
  d3_spells: data/D3_study_variables/D3_SPELLS.parquet
  medicines_field_by_deap:
    CPRD:
      code_col: medicinal_product_id
      coding_system: PRODCODEID
    default:
      code_col: medicinal_product_atc_code
      coding_system: ATC
create_complex_concepts:
  input_dir: data/D3_study_variables/D3_CONCEPTS_parquet
  spells_dir: data/D3_study_variables/D3_SPELLS.parquet
  dir_d2_db: data/D2_cdm/d2.duckdb
  output_dir: data/D3_study_variables/D3_CONCEPTS_parquet
  concept_meaning: transformations/common_configuration/RWE-BRIDGE/concept_meaning.csv
  functions: transformations/T2_semantic_harmonization/source_code/functions
  sql: transformations/T2_semantic_harmonization/source_code/sql
process_persons:
  persons: data/D2_cdm/d2.duckdb
  cdm_source: data/D2_cdm/d2.duckdb
  source_file: ~
  output_persons: transformations/T2_semantic_harmonization/intermediate_data_file
process_child_linkage:
   D3_person_file: data/D3_study_variables/D3_PERSONS.parquet
   person_relationship_file: PERSON_RELATIONSHIPS.csv
   survey_id_file: SURVEY_ID.csv
   survey_observations_file: SURVEY_OBSERVATIONS.csv
   output_child_linkage: transformations/T2_semantic_harmonization/intermediate_data_file
process_observation_periods:
  D3_person_file: data/D3_study_variables/D3_PERSONS.parquet
  source_file: ~
  observation_periods_file: data/D2_cdm/d2.duckdb
get_counts_all_concepts: ~

### T3

create_univariate_episodes:
  d3_spells_file_name: D3_SPELLS.parquet
  d3_fatherchild_file_name: D3_FatherChild.parquet
  d3_concepts: D3_CONCEPTS_parquet
  output_hive_path: D3_UNIVARIATE_EPISODES_parquet
  batch_size: 5000

create_multivariate_episodes:
  d3_univariate_episodes: D3_UNIVARIATE_EPISODES_parquet
  output_path: D3_MULTIVARIATE_EPISODES.parquet
  batch_size: 5000

create_cohort: 
  input:
    dir_d3: data/D3_study_variables
    input_file_name: D3_ELIGIBILITY.fst
  bootstrapping: FALSE
  n_bootstrap_samples: 3
  output:
    dir_d4: data/D4_analytic_datasets
    output_file_name: D4_StudyCohort.parquet
    output_file_name_child: D4_StudyCohortChild.parquet
  test_mode: false

create_eligibility:
  input:
    dir: data/D3_study_variables # test, change to data/D3_study_variables
    multi_file_name: D3_MULTIVARIATE_EPISODES.parquet # D3_multivariate_episodes/D3_multivariate_episodes.csv # change to D3_multivariate_episodes.parquet
    father_child_file_name: D3_FatherChild.parquet
  output:
    dir: data/D3_study_variables
    file_name: D3_ELIGIBILITY.fst

create_anchored_variables:
  input:
    cohort_dir: data/D4_analytic_datasets
    cohort_file: D4_StudyCohort.parquet
    cohort_file_child: D4_StudyCohortChild.parquet
    metadata_dir: transformations/T3_study_design/metadata
    metadata_file: anchoring_window_metadata.csv
    concepts_dir: data/D3_study_variables/D3_CONCEPTS_parquet
  config:
    anchor_males: true
    anchor_children: true
    anchor_mothers: true
  output:
    dir: data/D4_analytic_datasets
    baseline_cov_file: D4_StudyCohortCovariates.parquet
    baseline_cov_file_mother: D4_StudyCohortCovariatesMother.parquet
    tv_cov_file: D4_StudyCohortTimeVaryingCovariates.parquet
    fup_file: D4_StudyCohortFup.parquet
    fup_file_child: D4_StudyCohortFupChild.parquet
    anchoring_dir_male: data/D3_study_variables/D3_ANCHORED_VARIABLES_male_parquet
    anchoring_dir_mother: data/D3_study_variables/D3_ANCHORED_VARIABLES_mother_parquet
    anchoring_dir_child: data/D3_study_variables/D3_ANCHORED_VARIABLES_child_parquet
  test_mode: false

# ---------------------------------------------------
# impute_outcomes run configuration
# --------------------------------------------------


impute_outcomes:
  modes:
    - Main
    - Supplement
  input:
    fup_file: D4_StudyCohortFupChild
    cov_file: D4_StudyCohortCovariates
    ext: parquet
  model:
    n_imputations: 10
    maxit: 50
    seed: 42
    method: "logreg"
    predictors:
      - group
      - SV_AGE_FATHER_CAT
      # - SV_CALENDAR_TIME_INT
      - SV_PSYCHIATRIC_FATHER
      - SV_OBESITY
 #     - SV_MILDLIVERDYS
      # - SV_ASM_PREVIOUS
      - SV_TERATOGENIC_FATHER
      - SV_ALCOHOL_ABUSE
      - SV_SMOKING_FATHER
    additional_predictors:
      - SV_CALENDAR_TIME_INT
  output:
    fup_mi_file: D4_StudyCohortFupChildMI
    fup_bw_file: D4_StudyCohortFupChildBW
    ext: parquet
  table_output:
    dir: data/D5_results
    table_name: D5_Table12_Estimand1
    ext: csv

# ---------------------------------------------------
# outcome_analysis_lookup run configuration
# ---------------------------------------------------

outcome_analysis_lookup:
  input:
    ext: parquet
  metadata:
    outcome_analysis_types:   outcome_analysis_types.csv
    outcome_parameter_lookup: outcome_parameter_lookup.csv
  aesi_name:  "composite_outcome"
  aesi_label: "Composite child outcome: ADHD, autism, major congenital anomaly or death"
  scale_IR:   1
  n_bootstrap: 500
  seed: 42
  resample_col: father_id
  output:
    name: D5_CohortAnalyticLookup
    table8_name: Table8
    table9_name: Table9
    table13_name: Table13
    ext: csv

